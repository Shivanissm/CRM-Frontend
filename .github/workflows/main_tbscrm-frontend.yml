name: Deploy CRM Frontend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Deploy to Nginx
        run: |
          rm -rf /opt/crm-instagram-frontend/dist/*
          cp -a dist/. /opt/crm-instagram-frontend/dist/

      - name: Verify deployment
        run: |
          test -f /opt/crm-instagram-frontend/dist/index.html
          echo "CRM Frontend deployed successfully"
